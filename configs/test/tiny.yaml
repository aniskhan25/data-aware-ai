# Local smoke test. No Slurm, no LUMI, no GPU.
#
# Uses the tiny dataset profile and a short measurement window, so the whole
# pipeline runs in a few seconds. The numbers it produces are not meaningful
# performance results: the window is far too short and the dataset fits in page
# cache. Its purpose is to prove the plumbing works.
#
# DAAI_TEST_ROOT must point at a generated tiny dataset, for example:
#   export DAAI_TEST_ROOT=/tmp/daai-test
#   python scripts/generate_dataset.py --profile tiny --output "$DAAI_TEST_ROOT"

run:
  name: tiny-smoke-test
  seed: 1234
  warmup_batches: 2
  measured_batches: 8

dataset:
  layout: loose-files
  root: ${DAAI_TEST_ROOT}
  manifest: ${DAAI_TEST_ROOT}/manifest.jsonl

loader:
  batch_size: 16
  num_workers: 2
  prefetch_factor: 2
  persistent_workers: true
  shuffle: true
  drop_last: true
  compute_steps: 1

distributed:
  enabled: false
  validate_unique_samples: true

storage:
  location: local
  stage_to_tmp: false

output:
  directory: ${DAAI_TEST_ROOT}/outputs/tiny-smoke-test
