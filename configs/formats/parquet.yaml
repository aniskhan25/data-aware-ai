# Optional track: Parquet
#
# Reads the converted artifact through a DatasetAdapter, using the same loader, timing,
# and run summary as the core layouts. That is what makes this run comparable with the
# Part III results rather than merely similar to them — the comparison tools check the
# manifest hash and will refuse if it differs.
#
# Convert first:
#   python3 scripts/convert_dataset.py --to parquet \
#       --source "$TUTORIAL_ROOT/source" \
#       --manifest "$TUTORIAL_ROOT/source/manifest.jsonl" \
#       --output "$TUTORIAL_ROOT/parquet"
#
# Requires: pyarrow (present in LUMI's PyTorch containers)
#
# shuffle: true is deliberate. Random access across row groups is the access
# pattern that punishes a columnar layout, and measuring it is the point. Compare
# against shuffle: false to see what sequential access buys.

run:
  name: parquet-13workers-scratch
  seed: 1234
  warmup_batches: 20
  measured_batches: 1000

dataset:
  layout: adapter
  adapter: examples.parquet_track:ParquetAdapter
  root: ${TUTORIAL_ROOT}/parquet
  manifest: ${TUTORIAL_ROOT}/source/manifest.jsonl

loader:
  batch_size: 64
  num_workers: 13
  prefetch_factor: 2
  persistent_workers: true
  shuffle: true
  drop_last: true
  compute_steps: 1

distributed:
  enabled: false
  validate_unique_samples: true

storage:
  location: scratch
  stage_to_tmp: false

output:
  directory: ${TUTORIAL_ROOT}/outputs/formats/parquet
