# Part IV: worker ladder rung - 2 workers
#
# Only loader.num_workers changes across this ladder. The layout, storage, manifest,
# batch size, seed, and measurement length are identical, so the comparison isolates
# the worker count.
#
# The layout here is the one Part III chose. Override it if yours differed:
#   sbatch jobs/run_loader.sh configs/workers/workers_2.yaml dataset.layout=squashfs
#
# Two workers on a 7-core allocation. Enough to overlap loading with compute,
# well short of saturating the allocation.

run:
  name: workers-2
  seed: 1234
  warmup_batches: 20
  measured_batches: 200

dataset:
  layout: loose-files
  root: ${TUTORIAL_ROOT}/source
  manifest: ${TUTORIAL_ROOT}/source/manifest.jsonl

loader:
  batch_size: 64
  num_workers: 2
  prefetch_factor: 2
  persistent_workers: true
  shuffle: true
  drop_last: true
  compute_steps: 1

distributed:
  enabled: false
  validate_unique_samples: true

storage:
  location: scratch
  stage_to_tmp: false

output:
  directory: ${TUTORIAL_ROOT}/outputs/workers-2
