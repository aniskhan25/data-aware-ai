# Part IV: worker ladder rung — 6 workers
#
# Only loader.num_workers changes across this ladder. The layout, storage, manifest,
# batch size, seed, and measurement length are identical, so the comparison isolates
# the worker count.
#
# The layout here is the one Part III chose. Override it if yours differed:
#   sbatch jobs/run_loader.sh configs/workers/workers_6.yaml dataset.layout=squashfs
#
# Six workers plus the parent process: approximately one runnable process per
# *physical* core of a --cpus-per-task=7 allocation. This is the rung with no SMT
# sharing, and the reference point for reading the ones above it.

run:
  name: workers-6
  seed: 1234
  warmup_batches: 20
  measured_batches: 200

dataset:
  layout: loose-files
  root: ${TUTORIAL_ROOT}/source
  manifest: ${TUTORIAL_ROOT}/source/manifest.jsonl

loader:
  batch_size: 64
  num_workers: 6
  prefetch_factor: 2
  persistent_workers: true
  shuffle: true
  drop_last: true
  compute_steps: 1

distributed:
  enabled: false
  validate_unique_samples: true

storage:
  location: scratch
  stage_to_tmp: false

output:
  directory: ${TUTORIAL_ROOT}/outputs/workers-6
