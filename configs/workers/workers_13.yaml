# Part IV: worker ladder rung - 13 workers
#
# Only loader.num_workers changes across this ladder. The layout, storage, manifest,
# batch size, seed, and measurement length are identical, so the comparison isolates
# the worker count.
#
# The layout here is the one Part III chose. Override it if yours differed:
#   sbatch jobs/run_loader.sh configs/workers/workers_13.yaml dataset.layout=squashfs
#
# One worker per *logical* CPU, less one for the parent. On LUMI --cpus-per-task=7
# allocates seven physical cores whose affinity mask contains 14 logical CPUs, because
# each core carries two SMT threads. So 13 workers plus the parent fills the mask while
# placing TWO runnable processes on every physical core: SMT-saturated, not 14 CPUs.
# It is the largest rung inside the mask, and therefore the largest recommendable one,
# but compare it against rung 6 before believing the extra processes are free.

run:
  name: workers-13
  seed: 1234
  warmup_batches: 20
  measured_batches: 200

dataset:
  layout: loose-files
  root: ${TUTORIAL_ROOT}/source
  manifest: ${TUTORIAL_ROOT}/source/manifest.jsonl

loader:
  batch_size: 64
  num_workers: 13
  prefetch_factor: 2
  persistent_workers: true
  shuffle: true
  drop_last: true
  compute_steps: 1

distributed:
  enabled: false
  validate_unique_samples: true

storage:
  location: scratch
  stage_to_tmp: false

output:
  directory: ${TUTORIAL_ROOT}/outputs/workers-13
