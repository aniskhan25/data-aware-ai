# Part IV: worker ladder rung — 13 workers
#
# Only loader.num_workers changes across this ladder. The layout, storage, manifest,
# batch size, seed, and measurement length are identical, so the comparison isolates
# the worker count.
#
# The layout here is the one Part III chose. Override it if yours differed:
#   sbatch jobs/run_loader.sh configs/workers/workers_13.yaml dataset.layout=squashfs
#
# One worker per *logical* CPU, less one for the main process. On LUMI
# --cpus-per-task=7 yields 14 logical CPUs because of SMT, so 13 workers plus the
# main process exactly fills the allocation. This is the largest rung that does not
# oversubscribe, and therefore the largest that can be recommended.

run:
  name: workers-13
  seed: 1234
  warmup_batches: 20
  measured_batches: 200

dataset:
  layout: loose-files
  root: ${TUTORIAL_ROOT}/source
  manifest: ${TUTORIAL_ROOT}/source/manifest.jsonl

loader:
  batch_size: 64
  num_workers: 13
  prefetch_factor: 2
  persistent_workers: true
  shuffle: true
  drop_last: true
  compute_steps: 1

distributed:
  enabled: false
  validate_unique_samples: true

storage:
  location: scratch
  stage_to_tmp: false

output:
  directory: ${TUTORIAL_ROOT}/outputs/workers-13
