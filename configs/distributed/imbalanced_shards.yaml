# Part VI, Challenge E: shards of unequal size.
#
# WHAT IS BROKEN: every reader gets the same NUMBER of shards, but the shards hold very
# different numbers of samples. Assignment is correct — no duplicates, nothing missing —
# and the run is still bad, because with synchronised ranks the slowest sets the pace.
#
# Build the imbalanced shards first:
#   sbatch jobs/build_webdataset.sh 1250 count 6.0 shards-imbalanced
#
# Every reader still gets exactly 5 shards; only the sizes differ, by up to 6x. Sizes are
# random rather than ramped, because round-robin assignment cancels a monotonic ramp —
# each reader would get one shard from every size band and the totals would come out
# balanced.
#
# EXPECTED SYMPTOMS:
#   DUPLICATE_SAMPLES=0        assignment is correct
#   MISSING_SAMPLES=0          coverage is correct
#   RANK_ELAPSED_SPREAD high   ranks finish at very different times
#
# THE FIX: build shards balanced by estimated work rather than by sample count:
#   sbatch jobs/build_webdataset.sh 1250 work 1.0 shards-balanced-by-work
#
# THE LESSON: correct partitioning is necessary but not sufficient. Equal counts do not
# mean equal work.
run:
  name: distributed-imbalanced_shards
  seed: 1234
  warmup_batches: 10
  measured_batches: 200
  measured_epochs: 1

dataset:
  layout: webdataset
  root: ${TUTORIAL_ROOT}/shards-imbalanced
  manifest: ${TUTORIAL_ROOT}/source/manifest.jsonl

loader:
  batch_size: 64
  num_workers: 1
  prefetch_factor: 2
  persistent_workers: true
  shuffle: false
  drop_last: false
  compute_steps: 1
  shuffle_buffer: 0

distributed:
  enabled: true
  validate_unique_samples: false
  partition_by_rank: true
  backend: gloo

storage:
  location: scratch
  stage_to_tmp: false

output:
  directory: ${TUTORIAL_ROOT}/outputs/distributed/imbalanced_shards
