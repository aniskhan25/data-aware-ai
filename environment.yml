# Conda environment for running the tutorial outside a container.
#
#   conda env create -f environment.yml
#   conda activate data-aware-ai
#
# On LUMI, prefer a provided PyTorch container or module over building this
# environment on Lustre: a conda environment is tens of thousands of small files,
# which is exactly the metadata pressure this tutorial teaches you to avoid. If
# you do need one, use the LUMI container wrapper so the environment lives inside
# a single SquashFS image.
name: data-aware-ai
channels:
  - conda-forge
dependencies:
  - python>=3.10
  - numpy>=1.24
  - pillow>=10.0
  - pyyaml>=6.0
  - pytest>=7.4
  # PyTorch is only needed for the loader benchmarks. Install the build that
  # matches your platform; on LUMI use the ROCm build from a container or module
  # rather than a conda package.
  - pip
  - pip:
      - torch>=2.0
